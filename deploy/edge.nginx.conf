# TLS-terminating edge proxy for the partner platform's default Docker Compose
# stack (Finding 16: security_architecture_skills.md §1.3 Zero Trust, §12.1
# Runtime Hardening — see docs/ARCHITECTURE_REVIEW_ACTIONS.md and
# docs/adr/ADR-0003-fail-closed-a2a-ingress.md for related context).
#
# Fronts BOTH the frontend SPA and the backend API/A2A endpoints so the
# documented `docker compose up -d` Quick Start terminates TLS by default,
# rather than shipping cleartext-to-the-host as the out-of-the-box behavior.
#
# client_max_body_size matches the application-layer cap the backend itself
# enforces (Finding 9 — settings.a2a_max_request_body_bytes, default 10 MB) —
# this is DEFENSE IN DEPTH, not the primary control: security_architecture_
# skills.md §16 explicitly prohibits relying on the gateway alone, which is
# exactly why the backend enforces its own limit independent of this nginx
# tier (see app/core/body_size_middleware.py and
# app/a2a_common/hmac_middleware.py).

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    # Clickjacking defence. X-Frame-Options is the legacy header, honoured by
    # older browsers; CSP frame-ancestors is the modern, standards-track
    # equivalent and is what current browsers actually enforce. BOTH are set
    # because neither alone covers the full browser range — the Checkmarx
    # "Potential Clickjacking on Legacy Browsers" query specifically requires a
    # frame-ancestors directive, and X-Frame-Options is ignored by browsers that
    # implement CSP Level 2+.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Content-Security-Policy ─────────────────────────────────────────────
    #
    # Closes Checkmarx "Permissive Content Security Policy"
    # (Python\Cx\PythonLowVisibility v2, path 26, scanid 1016302), which
    # reported frontend/index.html for a <meta> CSP whose entire content was
    # `frame-ancestors 'none'` — permissive by any reading, and ineffective
    # besides: frame-ancestors is IGNORED in a meta tag (CSP L3 §3.3) and only
    # works as the response header below. That meta tag has been removed; this
    # header is now the single place the policy is defined and enforced.
    #
    # ON THE HASH. index.html carries the inline clickjacking frame buster (a
    # <style> that hides the document and a <script> that reveals it only when
    # unframed) — the layer the Checkmarx clickjacking query requires, which a
    # response header cannot satisfy because that query is a static check on
    # the HTML. `script-src 'self'` would block that inline script, and since
    # the style hides the page first, the result is a permanently BLANK app
    # with no error. The sha256 below authorises exactly those bytes, so the
    # policy stays strict and the frame buster keeps working.
    #
    # The hash is generated from the built artifact by
    # frontend/scripts/generate-csp.mjs (`npm run csp`). EDITING THE INLINE
    # SCRIPT IN index.html INVALIDATES IT — regenerate and paste the result
    # here. frontend/test/cspPolicy.test.mjs fails the build if this file and
    # the markup drift apart, so the blank-page failure cannot ship silently.
    #
    # style-src keeps 'unsafe-inline': the UI uses ~800 inline style={{...}}
    # props and CSP hashes do not cover style attributes. That permits CSS
    # injection, not script execution — script-src, the directive that actually
    # stops XSS, has no 'unsafe-inline'.
    set $csp_app "default-src 'self'; script-src 'self' 'sha256-zSg+YA/Gxu/cYVZF7PgyEiuBFQe0QcTTiWDWCNcLbTY='; style-src 'self' 'sha256-e/B6qhQlEQYacuQmN9AWBTUx5akc+4pzTO0kaxao/ME=' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-src 'self'; child-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'";
    add_header Content-Security-Policy $csp_app always;

    # Root redirect — matches the frontend's own nginx.conf convention.
    location = / {
        return 302 /a2a-partner/;
    }

    # Prototype-preview sandbox host — MUST precede the /a2a-partner/ prefix
    # location. `location =` is an exact match and nginx gives it priority over
    # prefix matches regardless of order, but the ordering is kept explicit so
    # the relationship is obvious to the next reader.
    #
    # This one static page gets a DIFFERENT, deliberately relaxed policy. It
    # hosts AI-generated click-through prototypes, which need inline script to
    # function (onclick handlers, setTimeout). Those documents cannot simply be
    # dropped into the app's own page: a srcDoc or blob: frame INHERITS the
    # embedder's CSP (verified in Chrome), so under the strict app policy the
    # prototypes rendered as dead mockups. Serving them from a real URL gives
    # them the policy of THIS response instead.
    #
    # Relaxed is not unguarded. 'unsafe-inline' here buys script execution and
    # nothing else:
    #   default-src 'none'  — no capability is granted unless named below
    #   connect-src 'none'  — no fetch / XHR / WebSocket / beacon: no egress
    #   form-action 'none'  — cannot POST data out
    #   img-src/font-src data: only — no remote asset can act as a beacon
    #   frame-src 'none'    — cannot nest further frames
    #   base-uri 'none'     — cannot rewrite relative URLs to an attacker host
    # and the embedding iframe sets sandbox="allow-scripts" WITHOUT
    # allow-same-origin, so the document is in an opaque origin with no access
    # to the parent DOM, cookies or the session token. A prompt-injected
    # payload can therefore run, but it can neither read anything of value nor
    # send anything anywhere.
    #
    # frame-ancestors 'self' (not 'none'): this page is MEANT to be framed, but
    # only by this application.
    location = /a2a-partner/preview-shell.html {
        proxy_pass http://frontend:80/preview-shell.html;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx add_header does NOT merge with the server-level directives: a
        # location with any add_header of its own discards ALL inherited ones.
        # Every header the app needs is therefore repeated here — omitting them
        # would silently strip nosniff and HSTS from this response.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    }

    # Frontend SPA.
    location /a2a-partner/ {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard/auth API.
    location /a2a-partner/api/ {
        proxy_pass http://backend:8001;
        rewrite ^/a2a-partner/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # long-running agent-job polling endpoints
    }

    # A2A protocol endpoints — NPCI calls these directly (not under /a2a-partner/).
    location /a2a-rpc/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /.well-known/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bare-API convenience path (health checks, non-UI callers hitting the
    # backend directly without the /a2a-partner/ prefix).
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
