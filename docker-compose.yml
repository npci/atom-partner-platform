# Standalone partner-platform stack — runs on its own, no NPCI monorepo needed.
#   docker compose up -d
# Brings up Postgres + the FastAPI backend + the React frontend. The five
# agents run in-process (feasibility real; design/code/test/negotiation stubs),
# so a fresh clone produces output immediately (mock without an LLM key).
# The platform is a CLIENT of a live NPCI instance over A2A — configure the NPCI
# URL + NPCI-issued credentials from the Settings UI after first login.

services:
  partner_postgres:
    # pgvector/pgvector:pg16 = stock Postgres 16 + the pgvector extension, used
    # by the RAG vector store (document_chunks / embedding_cache). It is PG16, so
    # the existing partner_pg_data volume migrates in place from postgres:16-alpine.
    image: pgvector/pgvector:pg16
    container_name: partner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PARTNER_POSTGRES_USER:-partner_user}
      POSTGRES_PASSWORD: ${PARTNER_POSTGRES_PASSWORD:-partner_password}
      POSTGRES_DB: ${PARTNER_POSTGRES_DB:-partner_db}
    volumes:
      - partner_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PARTNER_POSTGRES_USER:-partner_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Embedding model server for the RAG vector foundation. nomic-embed-text is
  # 768-dim and matches the vector(768) columns. The model is pulled on first
  # use (a manual `docker exec partner_ollama ollama pull nomic-embed-text`, or
  # the warmup call) — the named volume caches it across restarts.
  ollama:
    image: ollama/ollama:latest
    container_name: partner_ollama
    restart: unless-stopped
    volumes:
      - partner_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: partner_backend
    restart: unless-stopped
    depends_on:
      partner_postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - partner_data:/app/data
      # Capability profile (read-only). Ships the blank template; swap to
      # ./data/examples/hdfc_profile.md or your own to load a real profile.
      - ./data/partner_profile.template.md:/app/data/partner_profile.md:ro
      # Agent manifest (read-only) — edit bindings/prompts without rebuilding.
      - ./backend/config/agents.yaml:/app/config/agents.yaml:ro
    environment:
      DATABASE_URL: postgresql+psycopg://${PARTNER_POSTGRES_USER:-partner_user}:${PARTNER_POSTGRES_PASSWORD:-partner_password}@partner_postgres:5432/${PARTNER_POSTGRES_DB:-partner_db}
      PARTNER_NAME: ${PARTNER_NAME:-Partner Agent}
      AGENTS_CONFIG: /app/config/agents.yaml
      PARTNER_PROFILE_PATH: /app/data/partner_profile.md
      # Set a strong per-deployment value before production (the app warns otherwise).
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:-CHANGE_ME_INSECURE_DEFAULT}
      # LLM is optional — feasibility returns mock output when no key is set.
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      PARTNER_ANTHROPIC_API_KEY: ${PARTNER_ANTHROPIC_API_KEY:-}
      # Only needed if an agent in agents.yaml uses a remote `url:` binding.
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
      # RAG embeddings (Phase 3). Ollama serves nomic-embed-text (768-dim) into
      # the pgvector store. Defaults are wired for the in-compose service.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      EMBED_DIM: ${EMBED_DIM:-768}
    ports:
      - "8011:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: partner_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  partner_data:
  partner_pg_data:
  partner_ollama_data:
