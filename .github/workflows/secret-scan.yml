# Secret gate.
#
# Configured by .gitleaks.toml, which adds rules for the credential formats this
# ecosystem uses and stock gitleaks cannot know: the Authority mints partner API
# keys as `a2a_` + token_urlsafe(32), and this platform stores NPCI JWT and HMAC
# secrets, a partner API key, an Anthropic key and a GitLab token in
# `partner_settings`. A leak of any of those would pass a default scan silently.
#
# Kept close to the Authority platform's workflow on purpose: this repository is
# forked by partner organisations, and a gate that looks the same on both sides
# is one they can reason about once.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret deleted in the PR head may still be reachable
          # in an earlier commit of the same branch.
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        env:
          # Pinned deliberately. `latest` would let an upstream rule change turn
          # a green gate red — or worse, red to green — with no commit here.
          # This is the version .gitleaks.toml was verified against; bump the
          # two together, never the pin alone.
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree (blocking)
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --verbose

      # BLOCKING over ALL history. Verified clean at f06ea72 across every
      # commit, which is what makes a full-history gate affordable here rather
      # than a permanent red that gets deleted.
      #
      # This matters more for a forked repository than for most: a partner who
      # forks, commits a real NPCI secret, and later deletes it would otherwise
      # ship a repository whose history still carries it.
      - name: Scan full history (blocking)
        run: gitleaks detect --config .gitleaks.toml --redact --verbose
